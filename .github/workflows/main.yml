name: Build EV Breath APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Find the app folder
        id: find
        run: |
          f=$(find . -name capacitor.config.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$f" ]; then
            echo "capacitor.config.json not found. Files in this repo:"
            find . -maxdepth 3 -not -path "./.git*" | head -80
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "App folder: $(dirname "$f")"

      - name: Install Capacitor
        working-directory: ${{ steps.find.outputs.dir }}
        run: npm install

      - name: Create the Android project
        working-directory: ${{ steps.find.outputs.dir }}
        run: npx cap add android

      - name: App icon and splash screen
        working-directory: ${{ steps.find.outputs.dir }}
        run: npm run android:assets

      - name: Copy the app into Android
        working-directory: ${{ steps.find.outputs.dir }}
        run: npx cap sync android

      - name: Build the APK
        working-directory: ${{ steps.find.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename
        working-directory: ${{ steps.find.outputs.dir }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/EV-Breath-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: EV-Breath-APK
          path: EV-Breath-*.apk
