name: Build EV Breath APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build the APK
        run: |
          for z in $(find . -maxdepth 2 -name "*.zip"); do
            echo "Unzipping $z"
            unzip -q -o "$z" -d .
          done
          CFG=$(find . -name capacitor.config.json | head -1)
          if [ -z "$CFG" ]; then
            echo "capacitor.config.json not found"
            find . -maxdepth 3 | head -80
            exit 1
          fi
          APP=$(dirname "$CFG")
          echo "App folder: $APP"
          cd "$APP"
          npm install
          npx cap add android
          npm run android:assets
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/EV-Breath.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: EV-Breath-APK
          path: EV-Breath.apk
